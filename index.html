  var activeDay = 4;
  var isWeekendDay = false;
  var notifiedClassKey = "";

  function findCurrentDay() {
    var now = new Date();
    var dayOfWeek = now.getDay(); // 0 = Sun, 6 = Sat

    if (dayOfWeek === 0 || dayOfWeek === 6) {
      return "WEEKEND";
    }

    // Anchor Date: Oct 9, 2026 (Day 4)
    var anchorDate = new Date(2026, 9, 9);
    var anchorDay = 4;

    var todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var anchorMidnight = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), anchorDate.getDate());

    var diffDays = Math.round((todayMidnight - anchorMidnight) / 86400000);
    var calculatedDay = anchorDay;

    if (diffDays > 0) {
      for (var i = 0; i < diffDays; i++) {
        var nextDate = new Date(anchorMidnight.getTime() + (i + 1) * 86400000);
        if (nextDate.getDay() !== 0 && nextDate.getDay() !== 6) {
          calculatedDay = (calculatedDay % 5) + 1;
        }
      }
    } else if (diffDays < 0) {
      for (var j = 0; j < Math.abs(diffDays); j++) {
        var prevDate = new Date(anchorMidnight.getTime() - (j + 1) * 86400000);
        if (prevDate.getDay() !== 0 && prevDate.getDay() !== 6) {
          calculatedDay = ((calculatedDay - 2 + 5) % 5) + 1;
        }
      }
    }

    return calculatedDay;
  }

  function startPage() {
    var detected = findCurrentDay();
    var indicator = document.getElementById("indicator");
    var daySelector = document.getElementById("day-selector");
    var statusBox = document.getElementById("status-box");
    var list = document.getElementById("schedule-list");
    var weekendBox = document.getElementById("weekend-box");

    if (detected === "WEEKEND") {
      isWeekendDay = true;
      indicator.innerHTML = "Today is the Weekend!";
      daySelector.style.display = "none";
      statusBox.style.display = "none";
      list.style.display = "none";
      weekendBox.style.display = "block";
    } else {
      isWeekendDay = false;
      activeDay = detected;
      indicator.innerHTML = "Auto-synced to <strong>Day " + detected + "</strong>";
      daySelector.style.display = "flex";
      statusBox.style.display = "block";
      list.style.display = "flex";
      weekendBox.style.display = "none";
      setDay(detected);
    }
  }

  function setDay(dayNum) {
    if (isWeekendDay) return;
    activeDay = dayNum;

    for (var i = 1; i <= 5; i++) {
      var button = document.getElementById("b" + i);
      if (button) {
        if (i === dayNum) {
          button.className = "day-btn active";
        } else {
          button.className = "day-btn";
        }
      }
    }

    drawList();
    refreshStatus();
  }

  function drawList() {
    if (isWeekendDay || !activeDay) return;

    var listEl = document.getElementById("schedule-list");
    listEl.innerHTML = "";

    var now = new Date();
    var nowMins = now.getHours() * 60 + now.getMinutes();
    var dayItems = schedule[activeDay];

    for (var i = 0; i < dayItems.length; i++) {
      var item = dayItems[i];
      var isCurrent = nowMins >= item.startMin && nowMins < item.endMin;

      var row = document.createElement("div");
      row.className = "item" + (isCurrent ? " active-class" : "");

      var leftDiv = document.createElement("div");
      var titleDiv = document.createElement("div");
      titleDiv.className = "item-name";
      titleDiv.appendChild(document.createTextNode(item.period + ": " + item.name));

      var roomDiv = document.createElement("div");
      roomDiv.className = "item-room";
      roomDiv.appendChild(document.createTextNode(item.room ? item.room : "School"));

      leftDiv.appendChild(titleDiv);
      leftDiv.appendChild(roomDiv);

      var rightDiv = document.createElement("div");
      rightDiv.className = "item-time";
      rightDiv.appendChild(document.createTextNode(item.start + " - " + item.end));

      row.appendChild(leftDiv);
      row.appendChild(rightDiv);

      listEl.appendChild(row);
    }
  }

  function refreshStatus() {
    if (isWeekendDay || !activeDay) return;

    var now = new Date();
    var nowMins = now.getHours() * 60 + now.getMinutes();
    var dayItems = schedule[activeDay];

    var currentItem = null;
    var nextItem = null;

    for (var i = 0; i < dayItems.length; i++) {
      if (nowMins >= dayItems[i].startMin && nowMins < dayItems[i].endMin) {
        currentItem = dayItems[i];
        nextItem = dayItems[i + 1] || null;
        break;
      } else if (nowMins < dayItems[i].startMin) {
        nextItem = dayItems[i];
        break;
      }
    }

    var nowClassEl = document.getElementById("now-class");
    var nowTimeEl = document.getElementById("now-time");
    var nextClassEl = document.getElementById("next-class");

    if (currentItem) {
      nowClassEl.innerHTML = currentItem.period + " - " + currentItem.name;
      nowTimeEl.innerHTML = currentItem.start + " - " + currentItem.end + (currentItem.room ? " (" + currentItem.room + ")" : "");

      var key = currentItem.period + "_" + currentItem.start;
      if (notifiedClassKey !== key) {
        sendNotification(currentItem);
        notifiedClassKey = key;
      }
    } else if (nowMins < dayItems[0].startMin) {
      nowClassEl.innerHTML = "School Has Not Started";
      nowTimeEl.innerHTML = "Starts at " + dayItems[0].start;
    } else {
      nowClassEl.innerHTML = "Classes Done For Today";
      nowTimeEl.innerHTML = "See you tomorrow!";
    }

    if (nextItem) {
      nextClassEl.innerHTML = nextItem.period + ": " + nextItem.name + " (" + nextItem.start + ")";
    } else {
      nextClassEl.innerHTML = "None (End of Day)";
    }
  }

  function requestAlerts() {
    if (!("Notification" in window)) {
      alert("Notifications are not supported in this browser.");
      return;
    }

    Notification.requestPermission().then(function(perm) {
      var btn = document.getElementById("notif-btn");
      if (perm === "granted") {
        btn.innerHTML = "✅ Notifications Active";
        btn.style.backgroundColor = "#16a34a";
        new Notification("Notifications Active", {
          body: "You will be alerted when a class starts!"
        });
      } else {
        btn.innerHTML = "❌ Notifications Blocked";
      }
    });
  }

  function sendNotification(item) {
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("Next Up: " + item.period, {
        body: item.name + (item.room ? " (" + item.room + ")" : "") + " is starting now!"
      });
    }
  }

  startPage();
  setInterval(refreshStatus, 10000);
